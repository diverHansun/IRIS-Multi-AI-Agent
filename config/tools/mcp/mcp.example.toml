# Do not edit this file without the agreement of the user !
enabled = true
auto_start = true
prefer_mcp = true
namespace_strategy = "prefix"
default_prefix = "mcp_"

# Filesystem MCP
[mcp_servers.filesystem]
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "Relative path to the folder you want the AI to access"]
rename_prefix = "fs:"

# Notion MCP 
[mcp_servers.notion]
transport = "stdio"
command = "npx"
args = ["-y", "@notionhq/notion-mcp-server"]
rename_prefix = "notion:"

[mcp_servers.notion.env]
NOTION_TOKEN = "$NOTION_TOKEN"

# Context7 MCP
[mcp_servers.context7]
transport = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp", "--transport", "stdio"]
rename_prefix = "ctx7:"

[mcp_servers.context7.env]
CONTEXT7_MCP_URL = "https://mcp.context7.com/mcp"
CONTEXT7_API_KEY = "$CONTEXT7_API_KEY"

# Amap MCP
[mcp_servers.amap-maps]
transport = "stdio"
command = "npx"
args = ["-y", "@amap/amap-maps-mcp-server"]
rename_prefix = "amap:"

[mcp_servers.amap-maps.env]
AMAP_MAPS_API_KEY = "$AMAP_MAPS_API_KEY"

# Firecrawl MCP
[mcp_servers.firecrawl-mcp]
transport = "stdio"
command = "npx"
args = ["-y", "firecrawl-mcp"]
rename_prefix = "firecrawl:"

[mcp_servers.firecrawl-mcp.env]
FIRECRAWL_API_KEY = "$FIRECRAWL_API_KEY"

# Chrome DevTools MCP
[mcp_servers.chrome-devtools]
transport = "stdio"
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
rename_prefix = "chrome:"
