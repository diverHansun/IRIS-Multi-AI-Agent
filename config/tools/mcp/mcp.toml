# Do not edit this file without the agreeent of the user !
enabled = true
auto_start = true
prefer_mcp = true
namespace_strategy = "prefix"
default_prefix = "mcp_"

# filesystem MCP
[servers.filesystem]
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "./data"]
rename_prefix = "fs:"

# Notion MCP 
[servers.notion]
transport = "stdio"
command = "C:\\Users\\Hansun025\\AppData\\Roaming\\npm\\notion-mcp-server.cmd"
args = []
rename_prefix = "notion:"

[servers.notion.env]
NOTION_TOKEN = "$NOTION_TOKEN"
NOTION_MCP_URL = "$NOTION_MCP_URL"

# Context7 MCP
[servers.context7]
transport = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp", "--transport", "stdio"]
rename_prefix = "ctx7:"

[mcp_servers.context7]
command = "C:\\Program Files\\nodejs\\node.exe"
args = [
  "C:\\Users\\Hansun025\\AppData\\Roaming\\npm\\node_modules\\@upstash\\context7-mcp\\dist\\index.js",
  "--transport",
  "stdio"
]

[servers.context7.env]
CONTEXT7_MCP_URL = "https://mcp.context7.com/mcp"
CONTEXT7_API_KEY = "$CONTEXT7_API_KEY"


# Amap MCP
[servers.amap-maps]
transport = "streamable_http"
url = "https://mcp.amap.com/mcp?key=$AMAP_MAPS_API_KEY"
rename_prefix = "amap:"

# Firecrawl MCP
[servers.firecrawl-mcp]
transport = "stdio"
command = "npx"
args = ["-y", "firecrawl-mcp"]
rename_prefix = "firecrawl:"

[servers.firecrawl-mcp.env]
FIRECRAWL_API_KEY = "$FIRECRAWL_API_KEY"

# Chrome DevTools MCP
[servers.chrome-devtools]
transport = "stdio"
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
rename_prefix = "chrome:"